name: PetSync Clean Build

on:
  push:
    branches:
      - petsync-clean-refactor
  pull_request:
    branches:
      - petsync-clean-audit

permissions:
  contents: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply safe modular refactor
        run: node scripts/apply-clean-refactor.mjs

      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated refactor changes."
            exit 0
          fi
          git config user.name "PetSync Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PetSyncApp.js
          git commit -m "Extract shared contexts from PetSync app"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export web build
        run: npx expo export --platform web --output-dir dist-audit
