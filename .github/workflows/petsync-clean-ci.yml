name: PetSync Clean Build

on:
  push:
    branches:
      - petsync-clean-refactor
  pull_request:
    branches:
      - petsync-clean-audit

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export web build
        run: npx expo export --platform web --output-dir dist-audit
